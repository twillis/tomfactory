[project]
name = "tomfactory"
version = "0.1.0"
description = "A small near-loop software factory (proof of concept)."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installed into its own environment (editable, by `uv sync`), so
# `uv run --project <here> python -m factory` works from any directory.
[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "fr(id): the functional requirement this test covers",
    "live: uses the real agent program or desktop",
]
